spring.application.name=SpringBoot-EmployeeManagement

spring.datasource.url=jdbc:mysql://localhost:3306/empdb1?useSSL=false
spring.datasource.username=root
spring.datasource.password=1008
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql: true
 
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

#Swagger UI configure
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


#Logger configuration
logging.level.root= INFO
logging.level.com.springboot.basic=DEBUG
logging.file.name=application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n

#Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Spring security configuration
spring.security.user.name=Deepak
spring.security.user.password=12345
logging.level.org.springframework.security=DEBUG


# Hikari configuration
spring.datasource.hikari.pool-name=MyPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#logging.level.com.zaxxer.hikari=DEBUG
#logging.level.com.zaxxer.hikari.HikariConfig=DEBUG

